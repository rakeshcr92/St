<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>InsiderNet Demo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2em; }
      table { border-collapse: collapse; width: 50%; }
      th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
      th { background-color: #f5f5f5; }
    </style>
  </head>
  <body>
    <h1>InsiderNet Predictions</h1>
    <table>
      <tr>
        <th>Ticker</th>
        <th>Direction</th>
        <th>Confidence</th>
        <th>Anomaly</th>
        <th>Volatility</th>
      </tr>
      {% for row in rows %}
      <tr>
        <td>{{ row.ticker }}</td>
        <td>{{ row.direction }}</td>
        <td>{{ '%.2f'|format(row.confidence) }}</td>
        <td>{{ '%.2f'|format(row.anomaly) }}</td>
        <td>{{ '%.2f'|format(row.volatility) }}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
